[project]
name = "news-youtube-intelligence"
version = "0.1.0"
description = "Repository-backed YouTube and news intelligence pipeline"
requires-python = ">=3.11"
dependencies = ["feedparser>=6.0.11", "google-genai>=1.0.0", "PyYAML>=6.0.2", "requests>=2.32.0", "youtube-transcript-api>=1.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
