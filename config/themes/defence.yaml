themes:
- id: defence-procurement-theme
  theme_id: defence-procurement-theme
  micro_topic_id: procurement
  micro_topic: procurement
  domain: defence
  domain_id: defence
  topic: any
  topic_id: any
  version: 1.0.0
  priority: 8
  review_status: AI_VALIDATED
  objective: Assess Procurement (procurement) specifically through verified evidence,
    measurable change, and practical implications.
  scope:
    includes:
    - all_procurement_developments
    - verified_procurement_activity
    excludes:
    - tangential_defence_chatter_without_procurement_relevance
    boundaries:
    - focus_strictly_on_procurement_domain_significance
  questions:
  - what_changed_in_procurement
  - how_does_new_procurement_differ_from_prior_state
  - what_verifiable_evidence_supports_procurement
  - what_are_the_operational_or_market_implications_for_procurement
  - what_technical_limitations_or_uncertainties_remain_in_procurement
  - what_is_the_status_of_contract_for_procurement
  evidence_requirements: &id001
  - primary_or_independently_corroborated_evidence
  - primary_source_verification
  - official_disclosure_or_documentation
  evidence:
    required: *id001
    preferred:
    - primary_source
    - official_announcement
  significance_rules:
    significant_if:
    - verified_material_change_in_procurement_exceeding_baseline
    - independent_confirmation_of_procurement_milestone_from_primary_source
    - measurable_impact_on_defence_ecosystem_or_operations
    insignificant_if:
    - unsubstantiated_claims_or_rumors_regarding_procurement
    - minor_routine_maintenance_or_repackaging_without_new_procurement_capability
    - third_party_speculation_lacking_primary_source_attribution
  stream_rules:
    news: &id002
      preferred_sources: &id005
      - procurement
      - gov-us
      - gov-india
      freshness: 48h
      focus:
      - new_procurement_events
      - verifiable_changes_in_procurement
      - official_statements_vs_reported_claims
      - strategic_or_operational_impact
    video: &id003
      relevant_video_types:
      - technical_demonstrations
      - keynote_addresses
      - code_walkthroughs
      - expert_analysis
      questions:
      - what_was_directly_demonstrated_or_argued_regarding_procurement
      - what_tools_methods_or_data_were_used_for_procurement
      - what_practical_limitations_or_assumptions_were_acknowledged
      focus:
      - demonstrated_workflows
      - technical_mechanisms
      - reproducibility
      - empirical_claims
  content_streams:
    news: *id002
    video: *id003
  entity_extraction:
    required:
    - defence
    - primary_organization
    - technology_or_asset
    optional:
    - collaborators
    - affected_counterparties
    - standards_body
    - geographic_region
  event_extraction:
    event_types:
    - procurement_milestone
    - capability_enhancement
    - operational_deployment
  analysis_dimensions:
  - capability_delta
  - evidence_rigor
  - architectural_or_structural_shift
  - industry_adoption
  - risk_and_failure_modes
  output:
    report_type: technical_deep_dive
    sections: &id004
    - summary
    - evidence
    - implications
    - actions
    - sources
  output_requirements:
    report_type: technical_deep_dive
    sections: *id004
  no_update_policy:
    NO_MAJOR_UPDATE: No verified material development in Procurement (procurement)
      was identified during this reporting window.
    INSUFFICIENT_EVIDENCE: Retrieved reports regarding Procurement lacked primary
      corroboration or verifiable operational metrics.
    NO_RELEVANT_CONTENT: No relevant content met the freshness and source quality
      thresholds for Procurement.
  action_rules:
    monitor:
    - track_emerging_procurement_benchmarks
    - follow_official_defence_announcements
    investigate:
    - audit_claims_against_primary_procurement_documentation
    - verify_reproducibility_of_reported_procurement_data
  watch_rules:
    monitor:
    - next_procurement_milestone_or_release_date
    - peer_review_or_independent_validation_of_procurement
    - ecosystem_adoption_metrics_for_procurement
  retrieval_intent:
    required_concepts:
    - Procurement
    - procurement
    - contract
    - buyer
    - supplier
    preferred_source_types: *id005
    evidence_types: *id001
    exclusion_concepts:
    - unrelated_marketing_spam
    - crypto_clickbait
    freshness: 48h
  watch_items:
  - production_procurement_adoption
  - verified_metrics_for_procurement
  - defence_regulatory_or_competitive_response
  - contract
  - buyer
  disambiguation_focus:
  - Procurement
  - procurement
  - 'Procurement specific evaluation: Contract, buyer, supplier, value, delivery'
  - distinct from other defence topics
  trend_rules:
    minimum_distinct_dates: 3
    minimum_distinct_sources: 2
    minimum_evidence_items: 3
    minimum_significance: 0.7
    continuity_window_days: 14
  source_preferences:
    primary:
    - procurement
    - gov-us
    secondary:
    - specialist_coverage
    - industry_reporting
  uncertainty_rules:
    unverified_claim_handling: flag_as_unconfirmed
    inference_requirement: require_explicit_evidence_tag
