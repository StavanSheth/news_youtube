themes:
- id: quantum-computing-hardware-theme
  theme_id: quantum-computing-hardware-theme
  micro_topic_id: hardware
  micro_topic: hardware
  domain: quantum-computing
  domain_id: quantum-computing
  topic: any
  topic_id: any
  version: 1.0.0
  priority: 8
  review_status: AI_VALIDATED
  objective: Assess Hardware (hardware) specifically through verified evidence, measurable
    change, and practical implications.
  scope:
    includes:
    - all_hardware_developments
    - verified_hardware_activity
    excludes:
    - tangential_quantum-computing_chatter_without_hardware_relevance
    boundaries:
    - focus_strictly_on_hardware_domain_significance
  questions:
  - what_changed_in_hardware
  - how_does_new_hardware_differ_from_prior_state
  - what_verifiable_evidence_supports_hardware
  - what_are_the_operational_or_market_implications_for_hardware
  - what_technical_limitations_or_uncertainties_remain_in_hardware
  - what_is_the_status_of_qubit_architecture_for_hardware
  evidence_requirements: &id001
  - primary_or_independently_corroborated_evidence
  - primary_source_verification
  - official_disclosure_or_documentation
  evidence:
    required: *id001
    preferred:
    - primary_source
    - official_announcement
  significance_rules:
    significant_if:
    - verified_material_change_in_hardware_exceeding_baseline
    - independent_confirmation_of_hardware_milestone_from_primary_source
    - measurable_impact_on_quantum_computing_ecosystem_or_operations
    insignificant_if:
    - unsubstantiated_claims_or_rumors_regarding_hardware
    - minor_routine_maintenance_or_repackaging_without_new_hardware_capability
    - third_party_speculation_lacking_primary_source_attribution
  stream_rules:
    news: &id002
      preferred_sources: &id005
      - research
      - news-tech
      - ai-search
      freshness: 48h
      focus:
      - new_hardware_events
      - verifiable_changes_in_hardware
      - official_statements_vs_reported_claims
      - strategic_or_operational_impact
    video: &id003
      relevant_video_types:
      - technical_demonstrations
      - keynote_addresses
      - code_walkthroughs
      - expert_analysis
      questions:
      - what_was_directly_demonstrated_or_argued_regarding_hardware
      - what_tools_methods_or_data_were_used_for_hardware
      - what_practical_limitations_or_assumptions_were_acknowledged
      focus:
      - demonstrated_workflows
      - technical_mechanisms
      - reproducibility
      - empirical_claims
  content_streams:
    news: *id002
    video: *id003
  entity_extraction:
    required:
    - quantum_computing
    - primary_organization
    - technology_or_asset
    optional:
    - collaborators
    - affected_counterparties
    - standards_body
    - geographic_region
  event_extraction:
    event_types:
    - hardware_milestone
    - capability_enhancement
    - operational_deployment
  analysis_dimensions:
  - capability_delta
  - evidence_rigor
  - architectural_or_structural_shift
  - industry_adoption
  - risk_and_failure_modes
  output:
    report_type: technical_deep_dive
    sections: &id004
    - summary
    - evidence
    - implications
    - actions
    - sources
  output_requirements:
    report_type: technical_deep_dive
    sections: *id004
  no_update_policy:
    NO_MAJOR_UPDATE: No verified material development in Hardware (hardware) was identified
      during this reporting window.
    INSUFFICIENT_EVIDENCE: Retrieved reports regarding Hardware lacked primary corroboration
      or verifiable operational metrics.
    NO_RELEVANT_CONTENT: No relevant content met the freshness and source quality
      thresholds for Hardware.
  action_rules:
    monitor:
    - track_emerging_hardware_benchmarks
    - follow_official_quantum_computing_announcements
    investigate:
    - audit_claims_against_primary_hardware_documentation
    - verify_reproducibility_of_reported_hardware_data
  watch_rules:
    monitor:
    - next_hardware_milestone_or_release_date
    - peer_review_or_independent_validation_of_hardware
    - ecosystem_adoption_metrics_for_hardware
  retrieval_intent:
    required_concepts:
    - Hardware
    - hardware
    - qubit architecture
    - fidelity
    - scaling
    preferred_source_types: *id005
    evidence_types: *id001
    exclusion_concepts:
    - unrelated_marketing_spam
    - crypto_clickbait
    freshness: 48h
  watch_items:
  - production_hardware_adoption
  - verified_metrics_for_hardware
  - quantum_computing_regulatory_or_competitive_response
  - qubit architecture
  - fidelity
  disambiguation_focus:
  - Hardware
  - hardware
  - 'Hardware specific evaluation: Qubit architecture, fidelity, scaling, roadmap'
  - distinct from other quantum-computing topics
  trend_rules:
    minimum_distinct_dates: 3
    minimum_distinct_sources: 2
    minimum_evidence_items: 3
    minimum_significance: 0.7
    continuity_window_days: 14
  source_preferences:
    primary:
    - research
    - news-tech
    secondary:
    - specialist_coverage
    - industry_reporting
  uncertainty_rules:
    unverified_claim_handling: flag_as_unconfirmed
    inference_requirement: require_explicit_evidence_tag
