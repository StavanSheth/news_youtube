themes:
- id: finance-central-banks-theme
  theme_id: finance-central-banks-theme
  micro_topic_id: central-banks
  micro_topic: central-banks
  domain: finance
  domain_id: finance
  topic: any
  topic_id: any
  version: 1.0.0
  priority: 8
  review_status: AI_VALIDATED
  objective: Assess Central Banks (central-banks) specifically through verified evidence,
    measurable change, and practical implications.
  scope:
    includes:
    - all_central_banks_developments
    - verified_central_banks_activity
    excludes:
    - tangential_finance_chatter_without_central_banks_relevance
    boundaries:
    - focus_strictly_on_central-banks_domain_significance
  questions:
  - what_changed_in_central_banks
  - how_does_new_central_banks_differ_from_prior_state
  - what_verifiable_evidence_supports_central_banks
  - what_are_the_operational_or_market_implications_for_central_banks
  - what_technical_limitations_or_uncertainties_remain_in_central_banks
  - what_is_the_status_of_decision_for_central_banks
  evidence_requirements: &id001
  - primary_or_independently_corroborated_evidence
  - primary_source_verification
  - official_disclosure_or_documentation
  evidence:
    required: *id001
    preferred:
    - primary_source
    - official_announcement
  significance_rules:
    significant_if:
    - verified_material_change_in_central_banks_exceeding_baseline
    - independent_confirmation_of_central_banks_milestone_from_primary_source
    - measurable_impact_on_finance_ecosystem_or_operations
    insignificant_if:
    - unsubstantiated_claims_or_rumors_regarding_central_banks
    - minor_routine_maintenance_or_repackaging_without_new_central_banks_capability
    - third_party_speculation_lacking_primary_source_attribution
  stream_rules:
    news: &id002
      preferred_sources: &id005
      - finance
      - gov
      freshness: 24h
      focus:
      - new_central_banks_events
      - verifiable_changes_in_central_banks
      - official_statements_vs_reported_claims
      - strategic_or_operational_impact
    video: &id003
      relevant_video_types:
      - technical_demonstrations
      - keynote_addresses
      - code_walkthroughs
      - expert_analysis
      questions:
      - what_was_directly_demonstrated_or_argued_regarding_central_banks
      - what_tools_methods_or_data_were_used_for_central_banks
      - what_practical_limitations_or_assumptions_were_acknowledged
      focus:
      - demonstrated_workflows
      - technical_mechanisms
      - reproducibility
      - empirical_claims
  content_streams:
    news: *id002
    video: *id003
  entity_extraction:
    required:
    - finance
    - primary_organization
    - technology_or_asset
    optional:
    - collaborators
    - affected_counterparties
    - standards_body
    - geographic_region
  event_extraction:
    event_types:
    - central_banks_milestone
    - capability_enhancement
    - operational_deployment
  analysis_dimensions:
  - capability_delta
  - evidence_rigor
  - architectural_or_structural_shift
  - industry_adoption
  - risk_and_failure_modes
  output:
    report_type: top_event
    sections: &id004
    - summary
    - evidence
    - implications
    - actions
    - sources
  output_requirements:
    report_type: top_event
    sections: *id004
  no_update_policy:
    NO_MAJOR_UPDATE: No verified material development in Central Banks (central-banks)
      was identified during this reporting window.
    INSUFFICIENT_EVIDENCE: Retrieved reports regarding Central Banks lacked primary
      corroboration or verifiable operational metrics.
    NO_RELEVANT_CONTENT: No relevant content met the freshness and source quality
      thresholds for Central Banks.
  action_rules:
    monitor:
    - track_emerging_central_banks_benchmarks
    - follow_official_finance_announcements
    investigate:
    - audit_claims_against_primary_central_banks_documentation
    - verify_reproducibility_of_reported_central_banks_data
  watch_rules:
    monitor:
    - next_central_banks_milestone_or_release_date
    - peer_review_or_independent_validation_of_central_banks
    - ecosystem_adoption_metrics_for_central_banks
  retrieval_intent:
    required_concepts:
    - Central Banks
    - central-banks
    - decision
    - guidance
    - balance sheet
    preferred_source_types: *id005
    evidence_types: *id001
    exclusion_concepts:
    - unrelated_marketing_spam
    - crypto_clickbait
    freshness: 24h
  watch_items:
  - production_central_banks_adoption
  - verified_metrics_for_central_banks
  - finance_regulatory_or_competitive_response
  - decision
  - guidance
  disambiguation_focus:
  - Central Banks
  - central-banks
  - 'Central Banks specific evaluation: Decision, guidance, balance sheet, rationale'
  - distinct from other finance topics
  trend_rules:
    minimum_distinct_dates: 3
    minimum_distinct_sources: 2
    minimum_evidence_items: 3
    minimum_significance: 0.7
    continuity_window_days: 14
  source_preferences:
    primary:
    - finance
    - gov
    secondary:
    - specialist_coverage
    - industry_reporting
  uncertainty_rules:
    unverified_claim_handling: flag_as_unconfirmed
    inference_requirement: require_explicit_evidence_tag
