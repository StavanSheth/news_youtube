- id: regional-government-state-provincial-policy-theme
  theme_id: regional-government-state-provincial-policy-theme
  micro_topic_id: state-provincial-policy
  micro_topic: state-provincial-policy
  domain: regional-government
  domain_id: regional-government
  topic: any
  topic_id: any
  version: 1.0.0
  priority: 8
  review_status: AI_VALIDATED
  objective: Assess State/Provincial Policy (state-provincial-policy) specifically
    through verified evidence, measurable change, and practical implications.
  scope:
    includes:
    - all_state_provincial_policy_developments
    - verified_state/provincial_policy_activity
    excludes:
    - tangential_regional-government_chatter_without_state_provincial_policy_relevance
    boundaries:
    - focus_strictly_on_state-provincial-policy_domain_significance
  questions:
  - what_changed_in_state_provincial_policy
  - how_does_new_state/provincial_policy_differ_from_prior_state
  - what_verifiable_evidence_supports_state_provincial_policy
  - what_are_the_operational_or_market_implications_for_state_provincial_policy
  - what_technical_limitations_or_uncertainties_remain_in_state_provincial_policy
  - what_is_the_status_of_local_regulation_for_state_provincial_policy
  evidence_requirements: &id001
  - primary_or_independently_corroborated_evidence
  - primary_source_verification
  - official_disclosure_or_documentation
  evidence:
    required: *id001
    preferred:
    - primary_source
    - official_announcement
  significance_rules:
    significant_if:
    - verified_material_change_in_state/provincial_policy_exceeding_baseline
    - independent_confirmation_of_state_provincial_policy_milestone_from_primary_source
    - measurable_impact_on_regional_government_ecosystem_or_operations
    insignificant_if:
    - unsubstantiated_claims_or_rumors_regarding_state_provincial_policy
    - minor_routine_maintenance_or_repackaging_without_new_state_provincial_policy_capability
    - third_party_speculation_lacking_primary_source_attribution
  stream_rules:
    news: &id002
      preferred_sources: &id005
      - regional
      - gov
      freshness: 48h
      focus:
      - new_state_provincial_policy_events
      - verifiable_changes_in_state/provincial_policy
      - official_statements_vs_reported_claims
      - strategic_or_operational_impact
    video: &id003
      relevant_video_types:
      - technical_demonstrations
      - keynote_addresses
      - code_walkthroughs
      - expert_analysis
      questions:
      - what_was_directly_demonstrated_or_argued_regarding_state_provincial_policy
      - what_tools_methods_or_data_were_used_for_state/provincial_policy
      - what_practical_limitations_or_assumptions_were_acknowledged
      focus:
      - demonstrated_workflows
      - technical_mechanisms
      - reproducibility
      - empirical_claims
  content_streams:
    news: *id002
    video: *id003
  entity_extraction:
    required:
    - regional_government
    - primary_organization
    - technology_or_asset
    optional:
    - collaborators
    - affected_counterparties
    - standards_body
    - geographic_region
  event_extraction:
    event_types:
    - state_provincial_policy_milestone
    - capability_enhancement
    - operational_deployment
  analysis_dimensions:
  - capability_delta
  - evidence_rigor
  - architectural_or_structural_shift
  - industry_adoption
  - risk_and_failure_modes
  output:
    report_type: executive_brief
    sections: &id004
    - summary
    - evidence
    - implications
    - actions
    - sources
  output_requirements:
    report_type: executive_brief
    sections: *id004
  no_update_policy:
    NO_MAJOR_UPDATE: No verified material development in State/Provincial Policy (state-provincial-policy)
      was identified during this reporting window.
    INSUFFICIENT_EVIDENCE: Retrieved reports regarding State/Provincial Policy lacked
      primary corroboration or verifiable operational metrics.
    NO_RELEVANT_CONTENT: No relevant content met the freshness and source quality
      thresholds for State/Provincial Policy.
  action_rules:
    monitor:
    - track_emerging_state_provincial_policy_benchmarks
    - follow_official_regional_government_announcements
    investigate:
    - audit_claims_against_primary_state/provincial_policy_documentation
    - verify_reproducibility_of_reported_state_provincial_policy_data
  watch_rules:
    monitor:
    - next_state/provincial_policy_milestone_or_release_date
    - peer_review_or_independent_validation_of_state_provincial_policy
    - ecosystem_adoption_metrics_for_state_provincial_policy
  retrieval_intent:
    required_concepts:
    - State/Provincial Policy
    - state-provincial-policy
    - local regulation
    - program
    preferred_source_types: *id005
    evidence_types: *id001
    exclusion_concepts:
    - unrelated_marketing_spam
    - crypto_clickbait
    freshness: 48h
  watch_items:
  - production_state_provincial_policy_adoption
  - verified_metrics_for_state/provincial_policy
  - regional_government_regulatory_or_competitive_response
  - local regulation
  - program
  disambiguation_focus:
  - State/Provincial Policy
  - state-provincial-policy
  - 'State/Provincial Policy specific evaluation: Local regulation/program'
  - distinct from other regional-government topics
  trend_rules:
    minimum_distinct_dates: 3
    minimum_distinct_sources: 2
    minimum_evidence_items: 3
    minimum_significance: 0.7
    continuity_window_days: 14
  source_preferences:
    primary:
    - regional
    - gov
    secondary:
    - specialist_coverage
    - industry_reporting
  uncertainty_rules:
    unverified_claim_handling: flag_as_unconfirmed
    inference_requirement: require_explicit_evidence_tag
