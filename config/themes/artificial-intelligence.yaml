themes:
- id: ai-models-tools
  theme_id: ai-models-tools
  micro_topic_id: foundation-models
  micro_topic: foundation-models
  domain: artificial-intelligence
  domain_id: artificial-intelligence
  topic: any
  topic_id: any
  version: 1.0.0
  priority: 8
  review_status: AI_VALIDATED
  objective: Assess Foundation Models (foundation-models) specifically through verified
    evidence, measurable change, and practical implications.
  scope:
    includes:
    - all_foundation_models_developments
    - verified_foundation_models_activity
    excludes:
    - tangential_artificial-intelligence_chatter_without_foundation_models_relevance
    boundaries:
    - focus_strictly_on_foundation-models_domain_significance
  questions:
  - what_changed_in_foundation_models
  - how_does_new_foundation_models_differ_from_prior_state
  - what_verifiable_evidence_supports_foundation_models
  - what_are_the_operational_or_market_implications_for_foundation_models
  - what_technical_limitations_or_uncertainties_remain_in_foundation_models
  - what_is_the_status_of_new_model_for_foundation_models
  evidence_requirements: &id001
  - official_model_release
  - benchmark
  - model_card
  - independent_validation
  - primary_source_verification
  - official_disclosure_or_documentation
  evidence:
    required: *id001
    preferred:
    - primary_source
    - official_announcement
  significance_rules:
    significant_if:
    - verified_material_change_in_foundation_models_exceeding_baseline
    - independent_confirmation_of_foundation_models_milestone_from_primary_source
    - measurable_impact_on_artificial_intelligence_ecosystem_or_operations
    insignificant_if:
    - unsubstantiated_claims_or_rumors_regarding_foundation_models
    - minor_routine_maintenance_or_repackaging_without_new_foundation_models_capability
    - third_party_speculation_lacking_primary_source_attribution
  stream_rules:
    news: &id002
      preferred_sources: &id005
      - news-tech
      - research
      - github
      - ai-search
      freshness: 48h
      focus:
      - new_foundation_models_events
      - verifiable_changes_in_foundation_models
      - official_statements_vs_reported_claims
      - strategic_or_operational_impact
    video: &id003
      relevant_video_types:
      - technical_demonstrations
      - keynote_addresses
      - code_walkthroughs
      - expert_analysis
      questions:
      - what_was_directly_demonstrated_or_argued_regarding_foundation_models
      - what_tools_methods_or_data_were_used_for_foundation_models
      - what_practical_limitations_or_assumptions_were_acknowledged
      focus:
      - demonstrated_workflows
      - technical_mechanisms
      - reproducibility
      - empirical_claims
  content_streams:
    news: *id002
    video: *id003
  entity_extraction:
    required:
    - artificial_intelligence
    - primary_organization
    - technology_or_asset
    optional:
    - collaborators
    - affected_counterparties
    - standards_body
    - geographic_region
  event_extraction:
    event_types:
    - foundation_models_milestone
    - capability_enhancement
    - operational_deployment
  analysis_dimensions:
  - capability_delta
  - evidence_rigor
  - architectural_or_structural_shift
  - industry_adoption
  - risk_and_failure_modes
  output:
    report_type: technical_deep_dive
    sections: &id004
    - summary
    - evidence
    - implications
    - actions
    - sources
  output_requirements:
    report_type: technical_deep_dive
    sections: *id004
  no_update_policy:
    NO_MAJOR_UPDATE: No verified material development in Foundation Models (foundation-models)
      was identified during this reporting window.
    INSUFFICIENT_EVIDENCE: Retrieved reports regarding Foundation Models lacked primary
      corroboration or verifiable operational metrics.
    NO_RELEVANT_CONTENT: No relevant content met the freshness and source quality
      thresholds for Foundation Models.
  action_rules:
    monitor:
    - track_emerging_foundation_models_benchmarks
    - follow_official_artificial_intelligence_announcements
    investigate:
    - audit_claims_against_primary_foundation_models_documentation
    - verify_reproducibility_of_reported_foundation_models_data
  watch_rules:
    monitor:
    - next_foundation_models_milestone_or_release_date
    - peer_review_or_independent_validation_of_foundation_models
    - ecosystem_adoption_metrics_for_foundation_models
  retrieval_intent:
    required_concepts:
    - Foundation Models
    - foundation-models
    - new model
    - architecture
    - capability
    preferred_source_types: *id005
    evidence_types: *id001
    exclusion_concepts:
    - unrelated_marketing_spam
    - crypto_clickbait
    freshness: 48h
  watch_items:
  - production_foundation_models_adoption
  - verified_metrics_for_foundation_models
  - artificial_intelligence_regulatory_or_competitive_response
  - capability change
  - benchmark
  disambiguation_focus:
  - Foundation Models
  - foundation-models
  - 'Foundation Models specific evaluation: New model, architecture, capability, benchmark,
    context, mod'
  - distinct from other artificial-intelligence topics
  trend_rules:
    minimum_distinct_dates: 3
    minimum_distinct_sources: 2
    minimum_evidence_items: 3
    minimum_significance: 0.7
    continuity_window_days: 14
  source_preferences:
    primary:
    - news-tech
    - research
    secondary:
    - specialist_coverage
    - industry_reporting
  uncertainty_rules:
    unverified_claim_handling: flag_as_unconfirmed
    inference_requirement: require_explicit_evidence_tag
