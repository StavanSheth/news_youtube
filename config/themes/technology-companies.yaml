  - primary_or_independently_corroborated_evidence
  - primary_source_verification
  - official_disclosure_or_documentation
  evidence:
    required: *id001
    preferred:
    - primary_source
    - official_announcement
  significance_rules:
    significant_if:
    - verified_material_change_in_product_launches_exceeding_baseline
    - independent_confirmation_of_product_launches_milestone_from_primary_source
    - measurable_impact_on_technology_companies_ecosystem_or_operations
    insignificant_if:
    - unsubstantiated_claims_or_rumors_regarding_product_launches
    - minor_routine_maintenance_or_repackaging_without_new_product_launches_capability
    - third_party_speculation_lacking_primary_source_attribution
  stream_rules:
    news: &id002
      preferred_sources: &id005
      - company
      - news-tech
      freshness: 48h
      focus:
      - new_product_launches_events
      - verifiable_changes_in_product_launches
      - official_statements_vs_reported_claims
      - strategic_or_operational_impact
    video: &id003
      relevant_video_types:
      - technical_demonstrations
      - keynote_addresses
      - code_walkthroughs
      - expert_analysis
      questions:
      - what_was_directly_demonstrated_or_argued_regarding_product_launches
      - what_tools_methods_or_data_were_used_for_product_launches
      - what_practical_limitations_or_assumptions_were_acknowledged
      focus:
      - demonstrated_workflows
      - technical_mechanisms
      - reproducibility
      - empirical_claims
  content_streams:
    news: *id002
    video: *id003
  entity_extraction:
    required:
    - technology_companies
    - primary_organization
    - technology_or_asset
    optional:
    - collaborators
    - affected_counterparties
    - standards_body
    - geographic_region
  event_extraction:
    event_types:
    - product_launches_milestone
    - capability_enhancement
    - operational_deployment
  analysis_dimensions:
  - capability_delta
  - evidence_rigor
  - architectural_or_structural_shift
  - industry_adoption
  - risk_and_failure_modes
  output:
    report_type: executive_brief
    sections: &id004
    - summary
    - evidence
    - implications
    - actions
    - sources
  output_requirements:
    report_type: executive_brief
    sections: *id004
  no_update_policy:
    NO_MAJOR_UPDATE: No verified material development in Product Launches (product-launches)
      was identified during this reporting window.
    INSUFFICIENT_EVIDENCE: Retrieved reports regarding Product Launches lacked primary
      corroboration or verifiable operational metrics.
    NO_RELEVANT_CONTENT: No relevant content met the freshness and source quality
      thresholds for Product Launches.
  action_rules:
    monitor:
    - track_emerging_product_launches_benchmarks
    - follow_official_technology_companies_announcements
    investigate:
    - audit_claims_against_primary_product_launches_documentation
    - verify_reproducibility_of_reported_product_launches_data
  watch_rules:
    monitor:
    - next_product_launches_milestone_or_release_date
    - peer_review_or_independent_validation_of_product_launches
    - ecosystem_adoption_metrics_for_product_launches
  retrieval_intent:
    required_concepts:
    - Product Launches
    - product-launches
    - product
    - capability
    - availability
    preferred_source_types: *id005
    evidence_types: *id001
    exclusion_concepts:
    - unrelated_marketing_spam
    - crypto_clickbait
    freshness: 48h
  watch_items:
  - production_product_launches_adoption
  - verified_metrics_for_product_launches
  - technology_companies_regulatory_or_competitive_response
  - product
  - capability
  disambiguation_focus:
  - Product Launches
  - product-launches
  - 'Product Launches specific evaluation: Product, capability, availability, differentiation'
  - distinct from other technology-companies topics
  trend_rules:
    minimum_distinct_dates: 3
    minimum_distinct_sources: 2
    minimum_evidence_items: 3
    minimum_significance: 0.7
    continuity_window_days: 14
  source_preferences:
    primary:
