name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: Run Test Suite
        run: pytest
      - name: Validate Source Registry
        run: python -m intelligence.source_validation --all
      - name: Production Dry-Run Smoke Test
        run: python src/main.py --dry-run
