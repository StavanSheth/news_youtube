name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: Run Test Suite
        run: pytest
      - name: Validate Source Registry
        run: python -m intelligence.source_validation --all
      - name: Validate 236 Theme Coverage
        run: python -m intelligence.themes.coverage --all --fail-on-error
      - name: Theme Specificity Check
        run: python -m intelligence.themes.coverage --specificity --min-score 0.3 --fail-on-error
      - name: Evaluate Production Readiness Scorecard
        run: python scripts/scorecard.py --fail-on-error
      - name: Production Dry-Run Smoke Test
        run: python src/main.py --dry-run

  live-source-validation:
    name: Live Source Network Certification
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Live Source Network Validation
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python -m intelligence.source_validation --all --live
